<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Utenti · basewatch</title>
<link rel="stylesheet" href="style.css">
<style>
  main.col{max-width:1100px;margin:0 auto}
  .box{background:var(--superficie);border:1px solid var(--bordo);border-radius:12px;padding:14px 18px;margin:14px 0}
  h2{font-size:18px;margin:22px 0 8px}
  .msg{padding:8px 12px;border-radius:8px;margin:10px 0}.msg.ok{background:rgba(34,197,94,.15)}.msg.err{background:rgba(239,68,68,.18)}.msg.av{background:rgba(217,162,59,.18)}
</style>
</head>
<body>
<header class="top">
  <div class="titolo"><h1>👥 Utenti</h1><p id="sottotitolo" class="muted">Caricamento…</p></div>
  <nav class="menu" id="menu" aria-label="Pagine"></nav>
</header>
<main class="col">
  <div id="esito"></div>
  <h2>Richieste in attesa</h2>
  <div class="tabella-wrap"><table id="rich"></table></div>
  <h2>Utenti</h2>
  <div class="tabella-wrap"><table id="ute"></table></div>
  <p class="muted" id="nota-access"></p>
  <p><button class="az" id="prova-access" type="button">🔌 Verifica collegamento a Cloudflare Access</button> <span id="esito-access"></span></p>
  <p><button class="az" id="prova-tg" type="button">✈️ Invia messaggio di prova su Telegram</button> <span id="esito-tg"></span></p>
  <p class="muted" id="nota-link">Link da dare ai collaboratori: <b id="link"></b>.</p>
</main>
<script src="nav.js"></script>
<script src="comune.js"></script>
<script>
(() => {
  const { $, esc, api, msg } = window.C;
  const dmy = (s) => (s ? String(s).slice(0, 10).split("-").reverse().join("/") : "");
  async function carica() {
    const r = await api("/api/utenti");
    if (!r.ok) { $("sottotitolo").textContent = r.stato === 403 ? "Pagina riservata all'amministratore." : (r.dati && r.dati.errore) || "Errore " + r.stato; return; }
    const d = r.dati; $("sottotitolo").textContent = `${d.richieste.filter((x) => x.stato === "attesa").length} richieste in attesa · ${d.utenti.filter((u) => u.attivo).length} utenti attivi`;
    $("link").textContent = location.origin;
    $("nota-link").innerHTML = d.accesso_aperto
      ? `Link da dare ai collaboratori: <b>${esc(location.origin)}</b>. Entrano con la loro email e un codice; la prima volta compilano la richiesta e tu approvi qui sopra.`
      : `Link da dare ai collaboratori: <b>${esc(location.origin)}</b>. Chi non è ancora abilitato vede la schermata di Cloudflare: da lì può aprire la pagina <b>richiedi.html</b>.`;
    $("prova-access").parentElement.hidden = !!d.accesso_aperto;
    $("nota-access").textContent = d.accesso_aperto ? "Accesso aperto: l'approvazione qui è sufficiente, non serve toccare Cloudflare." : d.access_automatico ? "Le approvazioni aggiungono l'email a Cloudflare Access in automatico." : "⚠️ Cloudflare Access non è collegato: dopo ogni approvazione devi aggiungere tu l'email nella regola di Access (vedi istruzioni).";
    $("rich").innerHTML = "<thead><tr><th>Nome</th><th>Email</th><th>Richiesta</th><th>Messaggio</th><th>Stato</th><th></th></tr></thead><tbody>" +
      (d.richieste.length ? d.richieste.map((x) => `<tr><td>${esc(x.nome)}</td><td>${esc(x.email)}</td><td>${dmy(x.creato)}</td><td style="white-space:normal">${esc(x.messaggio)}</td><td>${esc(x.stato)}</td>
        <td>${x.stato === "attesa" ? `<button class="az pri" data-a="approva" data-e="${esc(x.email)}">✅ Approva</button> <button class="az" data-a="rifiuta" data-e="${esc(x.email)}">❌ Rifiuta</button>` : ""}</td></tr>`).join("") : '<tr><td colspan="6" class="muted">Nessuna richiesta.</td></tr>') + "</tbody>";
    const ed = new Set((d.editors || []).map((x) => String(x).toLowerCase()));
    $("ute").innerHTML = "<thead><tr><th>Nome</th><th>Email</th><th>Cartella</th><th>Canale alert</th><th>Dal</th><th>Stato</th><th>Portafoglio condiviso</th><th></th></tr></thead><tbody>" +
      (d.utenti.length ? d.utenti.map((u) => `<tr><td>${esc(u.nome || "")}</td><td>${esc(u.email)}</td><td>data/users/${esc(u.uid)}/</td><td>${esc(u.canale)}</td><td>${dmy(u.creato)}</td><td>${u.attivo ? "attivo" : "disattivato"}</td>
        <td>${u.attivo ? `<label><input type="checkbox" data-ed="${esc(u.email)}"${ed.has(String(u.email).toLowerCase()) ? " checked" : ""}> può modificare</label>` : ""}</td>
        <td>${u.attivo ? `<button class="az" data-a="rimuovi" data-e="${esc(u.email)}">Rimuovi accesso</button>` : ""}</td></tr>`).join("") : '<tr><td colspan="8" class="muted">Nessun utente oltre a te.</td></tr>') + "</tbody>";
  }
  document.addEventListener("change", async (ev) => {
    const c = ev.target.closest("input[data-ed]"); if (!c) return;
    c.disabled = true;
    const r = await api("/api/utenti/azione", { azione: "editor", email: c.dataset.ed, attivo: c.checked });
    $("esito").innerHTML = r.ok ? `<div class="msg ok">Fatto: ${esc(c.dataset.ed)} ${c.checked ? "può" : "non può più"} modificare il portafoglio condiviso.</div>` : `<div class="msg err">${esc((r.dati && r.dati.errore) || "errore " + r.stato)}</div>`;
    carica();
  });
  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-a]"); if (!b) return;
    if (b.dataset.a === "rimuovi" && !confirm("Rimuovere l'accesso a " + b.dataset.e + "? I suoi dati restano nel repo.")) return;
    b.disabled = true;
    const r = await api("/api/utenti/azione", { azione: b.dataset.a, email: b.dataset.e });
    if (r.ok) {
      const manuale = r.dati && r.dati.access === "manuale";
      $("esito").innerHTML = manuale ? `<div class="msg av">Fatto. <b>Ricorda</b>: aggiungi/rimuovi a mano ${esc(b.dataset.e)} nella regola di Cloudflare Access.</div>` : '<div class="msg ok">Fatto.</div>';
    } else $("esito").innerHTML = `<div class="msg err">${esc((r.dati && r.dati.errore) || "errore " + r.stato)}</div>`;
    carica();
  });
  $("prova-access").addEventListener("click", async () => {
    const e = $("esito-access"); e.textContent = "Verifico…";
    const r = await api("/api/utenti/access-test"); const d = r.dati || {};
    e.textContent = d.ok ? `✅ Collegato: regola «${d.regola}»${d.applicazione ? " (app «" + d.applicazione + "»)" : ""}, ${d.email} email ammesse.` : "❌ " + (d.errore || "errore " + r.stato);
  });
  $("prova-tg").addEventListener("click", async () => {
    const e = $("esito-tg"); e.textContent = "Invio…";
    const r = await api("/api/utenti/telegram-test", {}); const d = r.dati || {};
    e.textContent = d.ok ? "✅ Messaggio inviato: controlla Telegram." : "❌ " + (d.errore || "errore " + r.stato);
  });
  carica();
})();
</script>
</body>
</html>
