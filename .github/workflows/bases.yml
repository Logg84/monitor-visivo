name: bases

# Giro giornaliero dopo la chiusura di Wall Street (20:00 UTC d'estate, 21:00
# d'inverno): legge i candidati dal vecchio portale, scarica i prezzi,
# aggiorna lo stato delle basi e manda l'alert Telegram SOLO per le uscite dal
# range. Scrive data/bases.json (stato) e site/data/*.json (per il sito).
on:
  schedule:
    - cron: "30 22 * * 1-5"
  push:                      # un range corretto a mano dal sito rilancia il giro
    paths: ["data/override.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bases
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test sintetici
        run: |
          python tests/verifica_basi.py
          node tests/verifica_worker.mjs
          node tests/verifica_access.mjs
      - name: Giro basi
        env:
          OLD_REPO: ${{ secrets.OLD_REPO }}
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITO_URL: ${{ vars.SITO_URL }}
        run: python scripts/run.py
      - name: Commit stato
        run: |
          git config user.name "basewatch-bot"
          git config user.email "basewatch-bot@users.noreply.github.com"
          git add data/ site/data/
          git diff --cached --quiet || git commit -m "chore: stato basi"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || true
            sleep $((i * 5))
          done
          echo "::error::push non riuscito"; exit 1
