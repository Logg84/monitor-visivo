name: bases

# Lo lancia ogni sera il Worker Cloudflare (cron 22:30 UTC, lun-ven) con workflow_dispatch: nessun cron qui,
# altrimenti il giro partirebbe due volte. Giro giornaliero dopo la chiusura di Wall Street (20:00 UTC d'estate, 21:00
# d'inverno): legge i candidati dal vecchio portale, scarica i prezzi,
# aggiorna lo stato delle basi e manda l'alert Telegram per le uscite dal range
# (con il punteggio 1–6 letto da D1) e per i retest tenuti. Scrive data/bases.json (stato) e site/data/*.json (per il sito).
on:
  push:                      # un range corretto a mano dal sito rilancia il giro
    paths: ["data/override.json"]
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Solo prova di invio Telegram (non fa il giro)"
        type: boolean
        default: false
      test_email:
        description: "Solo prova di invio email (non fa il giro)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bases
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test sintetici
        run: |
          python tests/verifica_basi.py
          python tests/verifica_storico.py
          python tests/verifica_alert.py
          node tests/verifica_worker.mjs
          node tests/verifica_access.mjs
      - name: Giro basi
        env:
          OLD_REPO: ${{ secrets.OLD_REPO }}
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITO_URL: ${{ vars.SITO_URL }}
          TEST_EMAIL: ${{ inputs.test_email }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: python scripts/run.py
      - name: Commit stato
        run: |
          git config user.name "basewatch-bot"
          git config user.email "basewatch-bot@users.noreply.github.com"
          git add data/ site/data/
          git diff --cached --quiet || git commit -m "chore: stato basi"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || true
            sleep $((i * 5))
          done
          echo "::error::push non riuscito"; exit 1
