name: backtest-retest

# Solo manuale (Actions → backtest-retest → Run workflow). Legge data/eventi_range.csv,
# scarica i prezzi e scrive data/backtest_retest_report.md + data/backtest_retest_eventi.csv.
# Definizione pre-registrata in docs/backtest-retest.md. Non tocca lo stato del portale.
on:
  workflow_dispatch:
    inputs:
      da:
        description: "Solo uscite con alert da questa data (AAAA-MM-GG); 2016-11-04 = ultimi 10 anni"
        type: string
        default: "2016-11-04"
      anni:
        description: "Anni di storico da scaricare (devono coprire la finestra)"
        type: string
        default: "11"

permissions:
  contents: write

concurrency:
  group: backtest-retest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test sintetici
        run: python tests/verifica_retest.py
      - name: Backtest retest
        env:
          DA: ${{ inputs.da }}
          ANNI: ${{ inputs.anni }}
        run: python scripts/backtest_retest.py --da "${DA:-2016-11-04}" --anni "${ANNI:-11}"
      - name: Commit report
        run: |
          git config user.name "basewatch-bot"
          git config user.email "basewatch-bot@users.noreply.github.com"
          git add data/backtest_retest_report.md data/backtest_retest_eventi.csv
          git diff --cached --quiet || git commit -m "chore: report backtest retest"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin main || true
            sleep $((i * 5))
          done
          echo "::error::push non riuscito"; exit 1
